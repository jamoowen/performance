name: HTTP images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.1"
          cache-dependency-path: benchmarks/http/go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-dependency-glob: |
            Makefile
            ruff.toml
      - run: make tools
      - run: make check

  publish:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        runtime: [go, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository_owner }}/performance-http-${{ matrix.runtime }}
          tags: type=sha,prefix=sha-,format=long
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: benchmarks/http/${{ matrix.runtime }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=http-${{ matrix.runtime }}
          cache-to: type=gha,mode=max,scope=http-${{ matrix.runtime }}
      - name: Record amd64 image digest
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/performance-http-${{ matrix.runtime }}
          IMAGE_INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          AMD64_DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_INDEX_DIGEST}" --raw | jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("Expected exactly one linux/amd64 image manifest") end')"
          printf '%s@%s\n' "$IMAGE_NAME" "$AMD64_DIGEST" >> "$GITHUB_STEP_SUMMARY"
