name: SQLite capacity harness

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/http-capacity.yml
      - Makefile
      - biome.json
      - ruff.toml
      - benchmarks/http/capacity/**
      - benchmarks/http/ramp/measure/collector.py
  pull_request:
    paths:
      - .github/workflows/http-capacity.yml
      - Makefile
      - biome.json
      - ruff.toml
      - benchmarks/http/capacity/**
      - benchmarks/http/ramp/measure/collector.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: bun install --frozen-lockfile
      - run: make capacity-check
      - run: |
          PYTHONPATH=benchmarks/http/ramp uv run --no-project --with PyYAML==6.0.3 --with psutil==7.2.2 python3 -m unittest discover -s benchmarks/http/ramp/tests -p 'test_*.py'
          PYTHONPATH=benchmarks/http/ramp uv run --no-project --with plotly==7.1.0 python3 -m unittest discover -s benchmarks/http/ramp/report/tests -p 'test_*.py'
