[package]
name = "performance-http-rust"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
axum = "=0.8.6"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "time"] }

[lints.rust]
unsafe_code = "forbid"
